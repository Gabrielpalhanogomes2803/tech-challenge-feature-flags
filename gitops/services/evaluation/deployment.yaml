apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: togglemaster
  labels:
    app.kubernetes.io/name: evaluation-service
    app.kubernetes.io/part-of: togglemaster
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evaluation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluation-service
        app.kubernetes.io/part-of: togglemaster
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: evaluation-service
      serviceAccountName: evaluation-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: evaluation-service
        image: 966523587984.dkr.ecr.us-east-1.amazonaws.com/togglemaster-evaluation:6990e5c6923af288f57a3c7d0750052af525820d
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8004
        env:
        # OpenTelemetry: envia para o Collector (DaemonSet) do próprio nó.
        # HOST_IP precisa vir antes do endpoint para a expansão $(HOST_IP).
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://$(HOST_IP):4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_SERVICE_NAME
          value: "evaluation-service"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=togglemaster,deployment.environment=homolog"
        - name: OTEL_SEMCONV_STABILITY_OPT_IN
          value: "http"
        - name: PORT
          value: "8004"
        - name: REDIS_URL
          value: "rediss://master.togglemaster-homolog-redis.wb4in9.use1.cache.amazonaws.com:6379"
        - name: FLAG_SERVICE_URL
          value: "http://flag-service:8002"
        - name: TARGETING_SERVICE_URL
          value: "http://targeting-service:8003"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_SQS_URL
          value: "https://sqs.us-east-1.amazonaws.com/966523587984/togglemaster-analytics"
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: togglemaster-runtime-secrets
              key: SERVICE_API_KEY
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: temporary-files
          mountPath: /tmp
      volumes:
      - name: temporary-files
        emptyDir: {}

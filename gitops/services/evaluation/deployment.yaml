apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: togglemaster
  labels:
    app.kubernetes.io/name: evaluation-service
    app.kubernetes.io/part-of: togglemaster
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evaluation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluation-service
        app.kubernetes.io/part-of: togglemaster
    spec:
      serviceAccountName: evaluation-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: evaluation-service
        image: 505142286607.dkr.ecr.us-east-1.amazonaws.com/togglemaster-evaluation:dbb29ea8c5536cfa6e3978fc070dbb3d38297cba
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8004
        env:
        - name: PORT
          value: "8004"
        - name: REDIS_URL
          value: "redis://togglemaster-homolog-redis.ga9yzx.ng.0001.use1.cache.amazonaws.com:6379"
        - name: FLAG_SERVICE_URL
          value: "http://flag-service:8002"
        - name: TARGETING_SERVICE_URL
          value: "http://targeting-service:8003"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_SQS_URL
          value: "https://sqs.us-east-1.amazonaws.com/505142286607/togglemaster-analytics"
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: togglemaster-runtime-secrets
              key: SERVICE_API_KEY
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: temporary-files
          mountPath: /tmp
      volumes:
      - name: temporary-files
        emptyDir: {}

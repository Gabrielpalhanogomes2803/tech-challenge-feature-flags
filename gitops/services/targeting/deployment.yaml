apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
  labels:
    app.kubernetes.io/name: targeting-service
    app.kubernetes.io/part-of: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: targeting-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: targeting-service
        app.kubernetes.io/part-of: togglemaster
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: targeting-service
        image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/togglemaster-targeting:bootstrap
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8003
        env:
        - name: PORT
          value: "8003"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: togglemaster-runtime-secrets
              key: TARGETING_DATABASE_URL
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: temporary-files
          mountPath: /tmp
      volumes:
      - name: temporary-files
        emptyDir: {}

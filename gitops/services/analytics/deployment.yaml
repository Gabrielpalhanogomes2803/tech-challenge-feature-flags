apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: togglemaster
  labels:
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/part-of: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-service
        app.kubernetes.io/part-of: togglemaster
    spec:
      serviceAccountName: analytics-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: analytics-service
        image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/togglemaster-analytics:bootstrap
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8005
        env:
        - name: PORT
          value: "8005"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_SQS_URL
          value: "REPLACE_WITH_TERRAFORM_SQS_URL"
        - name: AWS_DYNAMODB_TABLE
          value: "ToggleMasterAnalytics"
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: temporary-files
          mountPath: /tmp
      volumes:
      - name: temporary-files
        emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster
  labels:
    app.kubernetes.io/name: flag-service
    app.kubernetes.io/part-of: togglemaster
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flag-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flag-service
        app.kubernetes.io/part-of: togglemaster
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: flag-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: flag-service
        image: 966523587984.dkr.ecr.us-east-1.amazonaws.com/togglemaster-flag:7c386d9f24da7da8a242e8c85afce41398bb02bd
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8002
        env:
        # OpenTelemetry: envia para o Collector (DaemonSet) do próprio nó.
        # HOST_IP precisa vir antes do endpoint para a expansão $(HOST_IP).
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://togglemaster-otel-collector.monitoring.svc.cluster.local:4317"
        - name: OTEL_SERVICE_NAME
          value: "flag-service"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=togglemaster,deployment.environment=homolog"
        - name: PORT
          value: "8002"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: togglemaster-runtime-secrets
              key: FLAG_DATABASE_URL
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: temporary-files
          mountPath: /tmp
      volumes:
      - name: temporary-files
        emptyDir: {}

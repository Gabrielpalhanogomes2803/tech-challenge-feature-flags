apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.14.3
      helm:
        releaseName: togglemaster-alloy
        valueFiles:
          - $values/gitops/monitoring/alloy/values.yaml
    - repoURL: https://github.com/Gabrielpalhanogomes2803/tech-challenge-feature-flags.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy: {}

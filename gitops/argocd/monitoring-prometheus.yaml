apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-prometheus
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.37.2
      helm:
        releaseName: togglemaster-prometheus
        valueFiles:
          - $values/gitops/monitoring/prometheus/values.yaml
    - repoURL: https://github.com/Gabrielpalhanogomes2803/tech-challenge-feature-flags.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

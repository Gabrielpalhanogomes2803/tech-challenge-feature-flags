---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-monitoring-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Gabrielpalhanogomes2803/tech-challenge-feature-flags.git
    targetRevision: main
    path: gitops/monitoring/grafana/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

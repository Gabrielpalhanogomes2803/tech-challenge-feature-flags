apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.5.0
      helm:
        releaseName: togglemaster-loki
        valueFiles:
          - $values/gitops/monitoring/loki/values.yaml
    - repoURL: https://github.com/Gabrielpalhanogomes2803/tech-challenge-feature-flags.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-blackbox-config
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      http_health:
        prober: http
        timeout: 5s
        http:
          method: GET
          valid_status_codes: [200]
          follow_redirects: false
          preferred_ip_protocol: ip4

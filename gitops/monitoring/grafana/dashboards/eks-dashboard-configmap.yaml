        {
          "id": 19,
          "title": "Nós monitorados",
          "type": "stat",
          "description": "Nós exportando métricas de boot, não necessariamente Kubernetes Ready.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(node_boot_time_seconds)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 6,
            "h": 4

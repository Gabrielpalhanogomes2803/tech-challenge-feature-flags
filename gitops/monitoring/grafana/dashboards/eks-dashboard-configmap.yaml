apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-eks-dashboard
  namespace: monitoring
data:
  eks-infrastructure.json: |
    {
      "uid": "togglemaster-eks-infra",
      "title": "ToggleMaster | Operations Center",
      "description": "Visão enxuta de operações: cinco microsserviços com indicadores e logs individuais, infraestrutura do EKS e investigação. Uptime dos nós não representa disponibilidade HTTP.",
      "tags": [
        "togglemaster",
        "eks",
        "sre",
        "devops",
        "fiap",
        "loki"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 4,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 100,
          "title": "01 · STATUS DO AMBIENTE",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 1,
          "title": "Serviços disponíveis",
          "type": "stat",
          "description": "Quantidade de deployments com pelo menos uma réplica disponível. Não representa a taxa de sucesso HTTP.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_deployment_status_replicas_available{namespace=\"togglemaster\",deployment=~\"(auth|flag|targeting|evaluation|analytics)-service\"} > 0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "N/D",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Réplicas disponíveis / desejadas",
          "type": "stat",
          "description": "Réplicas disponíveis. Compare com as réplicas desejadas na descrição ou detalhe de cada serviço; o valor é apenas o numerador.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"togglemaster\",deployment=~\"(auth|flag|targeting|evaluation|analytics)-service\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "N/D",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {

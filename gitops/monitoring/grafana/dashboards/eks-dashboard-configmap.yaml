                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "CPU (cores)"
            },
            {
              "refId": "D",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"togglemaster\",pod=~\"^auth-service-.*\",container!=\"\",container!=\"POD\"}) / 1024 / 1024",

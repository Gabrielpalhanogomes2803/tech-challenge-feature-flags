        {
          "id": 30,
          "title": "auth-service · saúde",
          "description": "Saúde operacional por réplicas, reinícios e consumo; 2 réplicas é o alvo atual. Não mede disponibilidade HTTP.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"togglemaster\",deployment=\"auth-service\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "Réplicas"
            },
            {
              "refId": "B",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"togglemaster\",pod=~\"^auth-service-.*\"}[1h])) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "Restarts 1h"
            },
            {
              "refId": "C",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"togglemaster\",pod=~\"^auth-service-.*\",container!=\"\",container!=\"POD\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "CPU (cores)"
            },
            {
              "refId": "D",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"togglemaster\",pod=~\"^auth-service-.*\",container!=\"\",container!=\"POD\"}) / 1024 / 1024",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "RAM (MiB)"
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 10,
            "h": 6
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2,
              "noValue": "N/D",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Réplicas"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        },
                        {
                          "color": "green",
                          "value": 2
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Restarts 1h"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "RAM (MiB)"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              }
            ]
          }

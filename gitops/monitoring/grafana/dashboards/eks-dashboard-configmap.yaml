                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Reinicializações · 1h",
          "type": "stat",
          "description": "Aumento estimado do contador de reinicializações nos últimos 60 minutos.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"togglemaster\"}[1h])) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"

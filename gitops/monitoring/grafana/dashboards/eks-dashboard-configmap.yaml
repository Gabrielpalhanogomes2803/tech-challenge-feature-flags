apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-eks-dashboard
  namespace: monitoring
data:
  eks-infrastructure.json: |
    {
      "uid": "togglemaster-eks-infra",
      "title": "ToggleMaster | Operations Center",
      "description": "V8: HTTP /health de cinco serviços por Blackbox Exporter; disponibilidade, latência e status HTTP. Os novos painéis exigem sincronizar Blackbox e Prometheus. Alerta Prometheus sem canal de notificação configurado.",
      "tags": [
        "togglemaster",
        "eks",
        "sre",
        "devops",
        "fiap",
        "loki"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 8,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 100,
          "title": "01 · VISÃO GERAL · AMBIENTE E CAPACIDADE",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 1,
          "title": "Microsserviços disponíveis",
          "type": "stat",
          "description": "Conta deployments com pelo menos uma réplica disponível. Verde indica os 5 serviços com réplicas; não é teste HTTP de disponibilidade da API.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_deployment_status_replicas_available{namespace=\"togglemaster\",deployment=~\"(auth|flag|targeting|evaluation|analytics)-service\"} > 0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "N/D",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 4
                  },
                  {
                    "color": "green",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Réplicas disponíveis",
          "type": "stat",
          "description": "Réplicas disponíveis somadas. Verde = 10 réplicas, capacidade planejada atual.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"togglemaster\",deployment=~\"(auth|flag|targeting|evaluation|analytics)-service\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "N/D",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 8
                  },
                  {
                    "color": "green",
                    "value": 10
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Réplicas desejadas",
          "type": "stat",
          "description": "Réplicas desejadas; compare com disponíveis.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_deployment_spec_replicas{namespace=\"togglemaster\",deployment=~\"(auth|flag|targeting|evaluation|analytics)-service\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 6,
            "h": 4

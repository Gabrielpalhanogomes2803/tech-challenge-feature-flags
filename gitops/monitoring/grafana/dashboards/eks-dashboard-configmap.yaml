          "type": "stat",
          "description": "Quantidade de targets node-exporter respondendo. Se indisponível, confira o job Prometheus; não equivale ao estado Ready do Kubernetes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"

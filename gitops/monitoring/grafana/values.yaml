replicas: 1

service:
  type: ClusterIP

persistence:
  enabled: true
  storageClassName: gp3-monitoring
  size: 5Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

admin:
  existingSecret: togglemaster-grafana-admin
  userKey: admin-user
  passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://togglemaster-prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: false

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://togglemaster-loki.monitoring.svc.cluster.local:3100
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: togglemaster
        orgId: 1
        folder: ToggleMaster
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/togglemaster

dashboardsConfigMaps:
  togglemaster: togglemaster-eks-dashboard

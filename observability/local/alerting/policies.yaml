apiVersion: 1
policies:
  - orgId: 1
    receiver: togglemaster-chatops
    group_by: ['grafana_folder', 'alertname']
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
    routes:
      - receiver: togglemaster-pagerduty
        object_matchers:
          - ['severity', '=', 'critical']
        continue: true
      - receiver: togglemaster-chatops
        object_matchers:
          - ['severity', '=', 'critical']
        continue: true
      - receiver: togglemaster-selfhealing
        object_matchers:
          - ['alertname', '=', 'AuthHigh5xxRate']

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster

spec:
  replicas: 1

  selector:
    matchLabels:
      app: flag-service

  template:
    metadata:
      labels:
        app: flag-service

    spec:
      containers:
      - name: flag-service
        image: 876908012464.dkr.ecr.us-east-1.amazonaws.com/togglemaster/flag-service:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8002

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        envFrom:
        - configMapRef:
            name: togglemaster-config
        - secretRef:
            name: togglemaster-secret

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: togglemaster

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
      - name: auth-service
        image: 876908012464.dkr.ecr.us-east-1.amazonaws.com/togglemaster/auth-service:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8001

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        envFrom:
        - secretRef:
            name: togglemaster-secret

        env:
        - name: PORT
          value: "8001"

        - name: DATABASE_URL
          value: "postgres://admin:admin123@postgres-auth:5432/auth_db?sslmode=disable"

        - name: MASTER_KEY
          value: "admin-secreto-123"
